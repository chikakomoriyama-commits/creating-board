<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="#252525" stroke-width="2"/>
  
  <!-- Waveform bars - podcast motif -->
  <!-- Left group -->
  <rect x="96"  y="228" width="20" height="56"  rx="10" fill="url(#wave)" opacity="0.6"/>
  <rect x="130" y="196" width="20" height="120" rx="10" fill="url(#wave)" opacity="0.75"/>
  <rect x="164" y="168" width="20" height="176" rx="10" fill="url(#wave)" opacity="0.9"/>
  
  <!-- Center bars - tallest -->
  <rect x="198" y="144" width="22" height="224" rx="11" fill="url(#wave)"/>
  <rect x="234" y="120" width="24" height="272" rx="12" fill="#fb923c"/>
  <rect x="272" y="136" width="22" height="240" rx="11" fill="url(#wave)"/>
  
  <!-- Right group -->
  <rect x="308" y="164" width="20" height="184" rx="10" fill="url(#wave)" opacity="0.9"/>
  <rect x="342" y="192" width="20" height="128" rx="10" fill="url(#wave)" opacity="0.75"/>
  <rect x="376" y="220" width="20" height="72"  rx="10" fill="url(#wave)" opacity="0.6"/>
  
  <!-- "CB" text at bottom -->
  <text x="256" y="448" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#fb923c" letter-spacing="8" opacity="0.85">CB</text>
</svg>
