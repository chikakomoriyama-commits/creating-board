function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ds){if(!ds)return"\u2014";var d=new Date(ds+"T00:00:00"),w=["\u65e5","\u6708","\u706b","\u6c34","\u6728","\u91d1","\u571f"];return(d.getMonth()+1)+"/"+d.getDate()+"\uff08"+w[d.getDay()]+"\uff09"}
function addD(ds,n){var d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0]}
function mkM(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function ml(m){var p=m.split("-");return p[0]+"\u5e74 "+parseInt(p[1])+"\u6708"}
function isOD(ds){if(!ds)return false;var t=new Date();t.setHours(0,0,0,0);return new Date(ds+"T00:00:00")<t}
function isT(ds){return ds&&ds===new Date().toISOString().split("T")[0]}
function dU(ds){if(!ds)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+"T00:00:00")-t)/864e5)}
function genTasks(rd,ex){ex=ex||[];return TT.map(function(t){var e=ex.find(function(x){return x.offset===t.offset});return{offset:t.offset,label:t.label,assignee:t.assignee,date:addD(rd,t.offset),done:e?e.done:false}})}
function buildScript(tpl,host,guests){var gl=guests.length===0?"":guests.length===1?"\u4eca\u65e5\u306e\u30b2\u30b9\u30c8\u306f\u3001"+(guests[0].intro||guests[0].name):"\u4eca\u65e5\u306e\u30b2\u30b9\u30c8\u306f\u3001"+guests[0].intro+"\n\n\u305d\u3057\u3066\u3001"+guests.slice(1).map(function(g){return g.intro||g.name}).join("\n\n\u305d\u3057\u3066\u3001");return tpl.replace("{{HOST}}",host).replace("{{GUESTS}}",gl)}
var inp={width:"100%",padding:"10px 12px",background:"#1a1a1a",border:"1px solid #333",borderRadius:"8px",fontSize:"14px",color:"#e8e8e8",outline:"none",boxSizing:"border-box"};
var lbl={display:"block",fontSize:"11px",fontWeight:600,color:"#888",marginBottom:"5px",textTransform:"uppercase",letterSpacing:"0.05em"};

function Waveform({width,height,bars,color}){width=width||120;height=height||28;bars=bars||24;color=color||"rgba(251,146,60,0.5)";var bW=width/bars*0.6,gap=width/bars,r=[];for(var i=0;i<bars;i++){var h=Math.max(4,Math.sin(i*0.7)*height*0.4+height*0.3+Math.sin(i*1.3)*height*0.2);r.push(<rect key={i} x={i*gap} y={(height-h)/2} width={bW} height={h} rx={bW/2} fill={color} opacity={0.4+Math.abs(Math.sin(i*0.5))*0.6}/>)}return <svg width={width} height={height} viewBox={"0 0 "+width+" "+height}>{r}</svg>}
function MatrixSelector({value,onChange}){var row=value?value.row:null,col=value?value.col:null;return(<table style={{width:"100%",borderCollapse:"separate",borderSpacing:"4px"}}><thead><tr><th style={{width:"60px"}}></th>{MC.map(function(c,ci){return <th key={ci} style={{fontSize:"11px",fontWeight:600,color:"#888",textAlign:"center",padding:"4px"}}>{c}</th>})}</tr></thead><tbody>{MR.map(function(r,ri){return(<tr key={ri}><td style={{fontSize:"11px",fontWeight:600,color:"#888",textAlign:"right",paddingRight:"8px"}}>{r}</td>{MC.map(function(c,ci){var sel=row===ri&&col===ci;return <td key={ci} style={{textAlign:"center"}}><button onClick={function(){onChange(sel?null:{row:ri,col:ci})}} style={{width:"100%",height:"36px",borderRadius:"6px",cursor:"pointer",fontFamily:"inherit",fontSize:"16px",border:sel?"2px solid #fb923c":"1px solid #333",background:sel?"rgba(251,146,60,0.2)":"#1a1a1a",color:sel?"#fb923c":"#444",transition:"all 0.15s"}}>{sel?"\u25c9":""}</button></td>})}</tr>)})}</tbody></table>)}

// ── Survey View (アンケート回答一覧・テーマリスト方式) ──
function epLabel(episodes,epId){
  var ep=episodes.find(function(e){return e.id===epId});
  if(!ep)return"（削除済みエピソード）";
  return(ep.theme||"（テーマ未設定）")+(ep.month?"　"+ml(ep.month):"");
}

function ThemeStatusBadge({status}){
  var isUsed=status==="used";
  return <span style={{fontSize:"10px",fontWeight:600,color:isUsed?"#4ade80":"#fbbf24",background:isUsed?"rgba(74,222,128,0.12)":"rgba(251,191,36,0.12)",padding:"2px 8px",borderRadius:"8px",whiteSpace:"nowrap"}}>{isUsed?"使用済み":"未使用"}</span>;
}

function CastThemeBlock({c,themes,episodes,onNewTheme,onEditTheme,onEditCast}){
  var castThemes=themes.filter(function(t){return t.cast_id===c.id});
  var isCand=c.cast_status==="candidate";
  return(<div style={{background:"#181818",border:isCand?"1px solid rgba(167,139,250,0.2)":"1px solid #252525",borderRadius:"12px",padding:"16px",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
        <div style={{fontSize:"14px",fontWeight:600,color:"#f5f5f5"}}>{c.name}</div>
        {isCand&&<span style={{fontSize:"10px",fontWeight:600,color:"#a78bfa",background:"rgba(167,139,250,0.12)",padding:"2px 8px",borderRadius:"10px"}}>{"候補"}</span>}
        <span style={{fontSize:"11px",color:"#555"}}>{castThemes.length+"件"}</span>
        {onEditCast&&<span onClick={function(){onEditCast(c)}} style={{fontSize:"11px",color:"#666",cursor:"pointer",textDecoration:"underline"}}>{"プロフィール編集"}</span>}
      </div>
      <button onClick={function(){onNewTheme(c.id)}} style={{background:"#282828",color:"#aaa",border:"1px solid #333",borderRadius:"8px",padding:"5px 12px",fontSize:"11px",cursor:"pointer",fontFamily:"inherit"}}>{"＋ テーマ追加"}</button>
    </div>
    {castThemes.length===0?(
      <div style={{fontSize:"12px",color:"#444",padding:"4px 0"}}>{"まだテーマがありません"}</div>
    ):(
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {castThemes.map(function(t){return(
          <div key={t.id} onClick={function(){onEditTheme({...t})}} style={{background:"#1a1a1a",border:"1px solid #252525",borderRadius:"8px",padding:"10px 12px",cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
              <div style={{fontSize:"13px",color:"#ddd",lineHeight:"1.5",flex:1}}>{t.theme_text}</div>
              <ThemeStatusBadge status={t.status}/>
            </div>
            {t.status==="used"&&t.used_in_episodes&&t.used_in_episodes.length>0&&(
              <div style={{fontSize:"11px",color:"#666",marginTop:"6px"}}>{"使用回："+t.used_in_episodes.map(function(epId){return epLabel(episodes,epId)}).join("、")}</div>
            )}
          </div>
        )})}
      </div>
    )}
  </div>);
}

function SurveyView({cast,episodes,themes,onSaveTheme,onDeleteTheme,onEditCast}){
  var[et,setEt]=useState(null);
  var regulars=cast.filter(function(c){return c.cast_status!=="candidate"});
  var candidates=cast.filter(function(c){return c.cast_status==="candidate"});
  var respondedIds={};themes.forEach(function(t){respondedIds[t.cast_id]=true});
  var responded=cast.filter(function(c){return respondedIds[c.id]});
  var notResponded=cast.filter(function(c){return!respondedIds[c.id]});
  var usedCount=themes.filter(function(t){return t.status==="used"}).length;

  function newTheme(castId){setEt({id:"",cast_id:castId,theme_text:"",status:"unused",used_in_episodes:[]})}

  return(<div>
    <div style={{fontSize:"14px",fontWeight:600,color:"#888",marginBottom:"16px"}}>{"アンケート回答（テーマリスト）"}</div>

    <div style={{display:"flex",gap:"12px",marginBottom:"20px",flexWrap:"wrap"}}>
      <div style={{background:"#181818",borderRadius:"8px",border:"1px solid #222",padding:"12px 16px",textAlign:"center"}}><div style={{fontSize:"20px",fontWeight:700,color:"#4ade80"}}>{responded.length}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px"}}>{"回答済み"}</div></div>
      <div style={{background:"#181818",borderRadius:"8px",border:"1px solid #222",padding:"12px 16px",textAlign:"center"}}><div style={{fontSize:"20px",fontWeight:700,color:notResponded.length>0?"#fbbf24":"#555"}}>{notResponded.length}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px"}}>{"未回答"}</div></div>
      <div style={{background:"#181818",borderRadius:"8px",border:"1px solid #222",padding:"12px 16px",textAlign:"center"}}><div style={{fontSize:"20px",fontWeight:700,color:"#fb923c"}}>{themes.length}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px"}}>{"テーマ総数"}</div></div>
      <div style={{background:"#181818",borderRadius:"8px",border:"1px solid #222",padding:"12px 16px",textAlign:"center"}}><div style={{fontSize:"20px",fontWeight:700,color:"#60a5fa"}}>{usedCount}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px"}}>{"使用済み"}</div></div>
    </div>

    {notResponded.length>0&&(<div style={{background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:"10px",padding:"14px 18px",marginBottom:"20px",fontSize:"13px",color:"#fbbf24"}}><strong>{"⚠ 未回答："}</strong><span style={{color:"#ccc",marginLeft:"8px"}}>{notResponded.map(function(c){return c.name}).join("、")}</span></div>)}

    <div style={{fontSize:"12px",fontWeight:600,color:"#666",marginBottom:"10px",textTransform:"uppercase",letterSpacing:"0.05em"}}>{"レギュラーキャスト"}</div>
    {regulars.map(function(c){return <CastThemeBlock key={c.id} c={c} themes={themes} episodes={episodes} onNewTheme={newTheme} onEditTheme={setEt} onEditCast={onEditCast}/>})}

    {candidates.length>0&&(<div>
      <div style={{fontSize:"12px",fontWeight:600,color:"#a78bfa",marginBottom:"10px",marginTop:"20px",textTransform:"uppercase",letterSpacing:"0.05em"}}>{"キャスト候補"}</div>
      {candidates.map(function(c){return <CastThemeBlock key={c.id} c={c} themes={themes} episodes={episodes} onNewTheme={newTheme} onEditTheme={setEt} onEditCast={onEditCast}/>})}
    </div>)}

    {et&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:"16px"}} onClick={function(){setEt(null)}}><div style={{background:"#1a1a1a",borderRadius:"14px",padding:"28px",width:"100%",maxWidth:"480px",border:"1px solid #282828",maxHeight:"90vh",overflowY:"auto"}} onClick={function(e){e.stopPropagation()}}>
      <div style={{fontSize:"17px",fontWeight:700,marginBottom:"22px",color:"#fff"}}>{et.id?"テーマ編集":"新しいテーマ"}</div>
      <div style={{marginBottom:"16px"}}><label style={lbl}>{"テーマ / 質問 *"}</label><textarea style={{...inp,minHeight:"80px",resize:"vertical",lineHeight:"1.5"}} value={et.theme_text} onChange={function(e){setEt({...et,theme_text:e.target.value})}} autoFocus placeholder={"探究したいこと・具体的な質問など"}/></div>
      <div style={{marginBottom:"16px"}}><label style={lbl}>{"ステータス"}</label><select style={{...inp,appearance:"auto"}} value={et.status||"unused"} onChange={function(e){setEt({...et,status:e.target.value})}}><option value="unused">{"未使用"}</option><option value="used">{"使用済み"}</option></select></div>
      {et.status==="used"&&(<div style={{marginBottom:"16px"}}><label style={lbl}>{"使用したエピソード"}</label>
        <div style={{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"8px"}}>
          {(et.used_in_episodes||[]).map(function(epId){return(
            <div key={epId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1a1a1a",border:"1px solid #282828",borderRadius:"6px",padding:"6px 10px",fontSize:"12px",color:"#ccc"}}>
              <span>{epLabel(episodes,epId)}</span>
              <button onClick={function(){setEt({...et,used_in_episodes:et.used_in_episodes.filter(function(x){return x!==epId})})}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"12px",fontFamily:"inherit"}}>{"×"}</button>
            </div>
          )})}
        </div>
        <select style={{...inp,appearance:"auto"}} value="" onChange={function(e){if(e.target.value){setEt({...et,used_in_episodes:(et.used_in_episodes||[]).concat([e.target.value])})}}}>
          <option value="">{"＋ エピソードを追加"}</option>
          {episodes.filter(function(ep){return(et.used_in_episodes||[]).indexOf(ep.id)<0}).map(function(ep){return <option key={ep.id} value={ep.id}>{epLabel(episodes,ep.id)}</option>})}
        </select>
      </div>)}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"10px",marginBottom:"24px"}}>{[{n:sm.total,l:"\u8a08\u753b",c:"#e8e8e8"},{n:sm.recorded,l:"\u53ce\u9332\u6e08",c:"#fb923c"},{n:sm.published,l:"\u914d\u4fe1\u6e08",c:"#4ade80"},{n:sm.needs,l:"\u8981\u5bfe\u5fdc",c:sm.needs>0?"#ef4444":"#555"}].map(function(item,i){return <div key={i} style={{background:"#181818",borderRadius:"10px",border:"1px solid #222",padding:"14px",textAlign:"center"}}><div style={{fontSize:"24px",fontWeight:700,color:item.c,fontVariantNumeric:"tabular-nums"}}>{item.n}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px",textTransform:"uppercase",letterSpacing:"0.05em"}}>{item.l}</div></div>})}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}><div style={{fontSize:"14px",fontWeight:600,color:"#777"}}>{ml(month)+" \u306e\u30b3\u30f3\u30c6\u30f3\u30c4"}</div><button onClick={function(){setEditEp(null);setShowForm(true)}} style={{background:"#fb923c",color:"#000",border:"none",borderRadius:"10px",padding:"9px 18px",fontSize:"13px",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"\uff0b \u30a8\u30d4\u30bd\u30fc\u30c9\u8ffd\u52a0"}</button></div>
        <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{mEps.length===0?(<div style={{textAlign:"center",padding:"56px 24px",color:"#444"}}><div style={{marginBottom:"16px"}}><Waveform width={200} height={40} bars={40} color={"rgba(255,255,255,0.08)"}/></div><div style={{fontSize:"15px",marginBottom:"8px",color:"#666"}}>{"\u307e\u3060\u30a8\u30d4\u30bd\u30fc\u30c9\u304c\u3042\u308a\u307e\u305b\u3093"}</div></div>):(mEps.map(function(ep,i){return <EpisodeCard key={ep.id} ep={ep} index={i} expanded={expId===ep.id} onToggle={function(){setExpId(expId===ep.id?null:ep.id)}} onTaskToggle={handleTT} onEdit={function(ep){setEditEp(ep);setShowForm(true)}} onRegenerate={regenerateScript}/>}))}</div>
      </div>)}
      {tab==="survey"&&<SurveyView cast={cast} episodes={episodes} themes={themes} onSaveTheme={saveTheme} onDeleteTheme={deleteTheme} onEditCast={handleEditCastFromSurvey}/>}
      {tab==="map"&&<ThemeMapView episodes={episodes}/>}
      {tab==="cast"&&<CastManager cast={cast} setCast={saveCastList} hosts={hosts} setHosts={saveHostList} template={template} setTemplate={saveTpl} themes={themes}/>}
    </div>
    {showForm&&<EpisodeForm episode={editEp} month={month} cast={cast} hosts={hosts} template={template} onSave={handleSave} onDelete={handleDel} onCancel={function(){setShowForm(false);setEditEp(null)}}/>}
  </div>);
}
var root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
