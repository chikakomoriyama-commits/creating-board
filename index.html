// ── Main App with Supabase ──
function App(){
  var[episodes,setEpisodes]=useState([]);
  var[cast,setCast]=useState([]);
  var[hosts,setHosts]=useState([]);
  var[template,setTemplate]=useState(DEFAULT_TEMPLATE);
  var[month,setMonth]=useState(mkM(new Date()));
  var[expId,setExpId]=useState(null);
  var[editEp,setEditEp]=useState(null);
  var[showForm,setShowForm]=useState(false);
  var[tab,setTab]=useState("episodes");
  var[loading,setLoading]=useState(true);
  var[error,setError]=useState(null);

  // ── Load all data from Supabase ──
  useEffect(function(){
    async function loadAll(){
      try{
        var[epRes,castRes,hostRes,setRes]=await Promise.all([
          sb.from("cb_episodes").select("*"),
          sb.from("cb_cast").select("*"),
          sb.from("cb_hosts").select("*"),
          sb.from("cb_settings").select("*"),
        ]);
        if(epRes.error)throw epRes.error;
        setEpisodes(epRes.data||[]);
        if(castRes.data&&castRes.data.length>0){setCast(castRes.data)}else{
          for(var c of DEFAULT_CAST){await sb.from("cb_cast").upsert(c)}
          setCast(DEFAULT_CAST);
        }
        if(hostRes.data&&hostRes.data.length>0){setHosts(hostRes.data)}else{
          for(var h of DEFAULT_HOSTS){await sb.from("cb_hosts").upsert(h)}
          setHosts(DEFAULT_HOSTS);
        }
        if(setRes.data){var tpl=setRes.data.find(function(s){return s.key==="template"});if(tpl)setTemplate(tpl.value)}
      }catch(e){console.error(e);setError("\u30c7\u30fc\u30bf\u306e\u8aad\u307f\u8fbc\u307f\u306b\u5931\u6557\u3057\u307e\u3057\u305f: "+e.message)}
      setLoading(false);
    }
    loadAll();
  },[]);

  // ── Save helpers ──
  async function saveEp(ep){
    var{error}=await sb.from("cb_episodes").upsert(ep);
    if(error){console.error(error);return}
    var ex=episodes.find(function(e){return e.id===ep.id});
    setEpisodes(ex?episodes.map(function(e){return e.id===ep.id?ep:e}):episodes.concat([ep]));
  }
  async function delEp(id){
    await sb.from("cb_episodes").delete().eq("id",id);
    setEpisodes(episodes.filter(function(e){return e.id!==id}));
  }
  async function saveCastList(newCast){
    setCast(newCast);
    var ids=newCast.map(function(c){return c.id});
    var toDelete=cast.filter(function(c){return ids.indexOf(c.id)<0});
    for(var d of toDelete){await sb.from("cb_cast").delete().eq("id",d.id)}
    for(var c of newCast){await sb.from("cb_cast").upsert({id:c.id,name:c.name,intro:c.intro})}
  }
  async function saveHostList(newHosts){
    setHosts(newHosts);
    var ids=newHosts.map(function(h){return h.id});
    var toDelete=hosts.filter(function(h){return ids.indexOf(h.id)<0});
    for(var d of toDelete){await sb.from("cb_hosts").delete().eq("id",d.id)}
    for(var h of newHosts){await sb.from("cb_hosts").upsert({id:h.id,name:h.name})}
  }
  async function saveTpl(t){
    setTemplate(t);
    await sb.from("cb_settings").upsert({key:"template",value:t});
  }

  var mEps=episodes.filter(function(e){return e.month===month}).sort(function(a,b){if(a.recording_date&&b.recording_date)return a.recording_date.localeCompare(b.recording_date);if(a.recording_date)return-1;if(b.recording_date)return 1;return 0});
  function prevM(){var d=new Date(month+"-01");d.setMonth(d.getMonth()-1);setMonth(mkM(d));setExpId(null)}
  function nextM(){var d=new Date(month+"-01");d.setMonth(d.getMonth()+1);setMonth(mkM(d));setExpId(null)}

  function handleSave(ep){saveEp(ep);setShowForm(false);setEditEp(null);setExpId(ep.id)}
  function handleDel(id){delEp(id);setShowForm(false);setEditEp(null);setExpId(null)}
  function handleTT(epId,idx){
    var ep=episodes.find(function(e){return e.id===epId});if(!ep)return;
    var t=ep.tasks.slice();t[idx]={...t[idx],done:!t[idx].done};
    var updated={...ep,tasks:t};saveEp(updated);
  }

  var alerts=[];episodes.forEach(function(ep){if(!ep.tasks)return;ep.tasks.forEach(function(t){if(!t.done&&(isT(t.date)||isOD(t.date)))alerts.push({...t,episodeTheme:ep.theme})})});
  var sm={total:mEps.length,recorded:mEps.filter(function(e){return["recorded","naming","stock","published"].indexOf(e.status)>=0}).length,published:mEps.filter(function(e){return e.status==="published"}).length,needs:mEps.filter(function(e){return["draft","cast_confirmed"].indexOf(e.status)>=0}).length};

  if(loading)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#888"}}><div style={{textAlign:"center"}}><Waveform width={120} height={30} bars={24}/><div style={{marginTop:"12px"}}>{"\u8aad\u307f\u8fbc\u307f\u4e2d..."}</div></div></div>;
  if(error)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#ef4444",padding:"24px",textAlign:"center"}}><div><div style={{fontSize:"16px",fontWeight:600,marginBottom:"8px"}}>{"\u63a5\u7d9a\u30a8\u30e9\u30fc"}</div><div style={{fontSize:"13px",color:"#999"}}>{error}</div></div></div>;

  return(<div style={{minHeight:"100vh"}}>
    <div style={{background:"linear-gradient(135deg,#111 0%,#1a1a1a 100%)",padding:"24px 24px 0",borderBottom:"1px solid #222",position:"sticky",top:0,zIndex:50}}><div style={{maxWidth:"800px",margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"12px",paddingBottom:"16px"}}><div><div style={{display:"flex",alignItems:"center",gap:"12px"}}><div style={{fontSize:"22px",fontWeight:700,letterSpacing:"-0.02em"}}><span style={{color:"#fb923c"}}>Creating</span><span style={{color:"#666",fontWeight:400,marginLeft:"8px"}}>Board</span></div><Waveform width={80} height={20} bars={16}/></div><div style={{fontSize:"11px",color:"#555",marginTop:"2px",letterSpacing:"0.04em"}}>PODCAST PRODUCTION MANAGEMENT</div></div>
        {tab==="episodes"&&(<div style={{display:"flex",alignItems:"center",gap:"10px"}}><button onClick={prevM} style={{background:"none",border:"1px solid #333",color:"#777",borderRadius:"8px",padding:"7px 12px",cursor:"pointer",fontSize:"13px",fontFamily:"inherit"}}>{"\u2190"}</button><div style={{fontSize:"15px",fontWeight:600,color:"#ccc",minWidth:"110px",textAlign:"center"}}>{ml(month)}</div><button onClick={nextM} style={{background:"none",border:"1px solid #333",color:"#777",borderRadius:"8px",padding:"7px 12px",cursor:"pointer",fontSize:"13px",fontFamily:"inherit"}}>{"\u2192"}</button></div>)}
      </div>
      <div style={{display:"flex",gap:"0"}}><button className={"tab-btn"+(tab==="episodes"?" active":"")} onClick={function(){setTab("episodes")}}>{"\ud83c\udf99 \u30a8\u30d4\u30bd\u30fc\u30c9"}</button><button className={"tab-btn"+(tab==="map"?" active":"")} onClick={function(){setTab("map")}}>{"\ud83d\uddfa\ufe0f \u30c6\u30fc\u30de\u30de\u30c3\u30d7"}</button><button className={"tab-btn"+(tab==="cast"?" active":"")} onClick={function(){setTab("cast")}}>{"\ud83d\udc65 \u30ad\u30e3\u30b9\u30c8\u30fb\u8a2d\u5b9a"}</button></div>
    </div></div>

    <div style={{maxWidth:"800px",margin:"0 auto",padding:"24px 16px"}}>
      {tab==="episodes"&&(<div>
        {alerts.length>0&&(<div style={{background:"rgba(251,146,60,0.08)",border:"1px solid rgba(251,146,60,0.2)",borderRadius:"10px",padding:"14px 18px",marginBottom:"20px",fontSize:"13px",color:"#fb923c"}}><strong>{"\u26a1 \u5bfe\u5fdc\u304c\u5fc5\u8981\uff1a"}</strong>{alerts.slice(0,3).map(function(t,i){return <div key={i} style={{marginTop:"4px",color:"#ccc"}}>{(isOD(t.date)?"\ud83d\udd34":"\ud83d\udfe1")+" "+t.label+"\uff08"+t.episodeTheme+"\uff09\u2014 "+fmt(t.date)}</div>})}{alerts.length>3&&<div style={{marginTop:"4px",color:"#888"}}>{"\u307b\u304b "+(alerts.length-3)+" \u4ef6"}</div>}</div>)}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"10px",marginBottom:"24px"}}>{[{n:sm.total,l:"\u8a08\u753b",c:"#e8e8e8"},{n:sm.recorded,l:"\u53ce\u9332\u6e08",c:"#fb923c"},{n:sm.published,l:"\u914d\u4fe1\u6e08",c:"#4ade80"},{n:sm.needs,l:"\u8981\u5bfe\u5fdc",c:sm.needs>0?"#ef4444":"#555"}].map(function(item,i){return <div key={i} style={{background:"#181818",borderRadius:"10px",border:"1px solid #222",padding:"14px",textAlign:"center"}}><div style={{fontSize:"24px",fontWeight:700,color:item.c,fontVariantNumeric:"tabular-nums"}}>{item.n}</div><div style={{fontSize:"10px",color:"#666",marginTop:"2px",textTransform:"uppercase",letterSpacing:"0.05em"}}>{item.l}</div></div>})}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}><div style={{fontSize:"14px",fontWeight:600,color:"#777"}}>{ml(month)+" \u306e\u30b3\u30f3\u30c6\u30f3\u30c4"}</div><button onClick={function(){setEditEp(null);setShowForm(true)}} style={{background:"#fb923c",color:"#000",border:"none",borderRadius:"10px",padding:"9px 18px",fontSize:"13px",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{"\uff0b \u30a8\u30d4\u30bd\u30fc\u30c9\u8ffd\u52a0"}</button></div>
        <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{mEps.length===0?(<div style={{textAlign:"center",padding:"56px 24px",color:"#444"}}><div style={{marginBottom:"16px"}}><Waveform width={200} height={40} bars={40} color={"rgba(255,255,255,0.08)"}/></div><div style={{fontSize:"15px",marginBottom:"8px",color:"#666"}}>{"\u307e\u3060\u30a8\u30d4\u30bd\u30fc\u30c9\u304c\u3042\u308a\u307e\u305b\u3093"}</div><div style={{fontSize:"13px"}}>{"\u300c\u30a8\u30d4\u30bd\u30fc\u30c9\u8ffd\u52a0\u300d\u304b\u3089"+ml(month)+"\u306e\u30b3\u30f3\u30c6\u30f3\u30c4\u8a08\u753b\u3092\u59cb\u3081\u307e\u3057\u3087\u3046"}</div></div>):(mEps.map(function(ep,i){return <EpisodeCard key={ep.id} ep={ep} index={i} expanded={expId===ep.id} onToggle={function(){setExpId(expId===ep.id?null:ep.id)}} onTaskToggle={handleTT} onEdit={function(ep){setEditEp(ep);setShowForm(true)}}/>}))}</div>
      </div>)}
      {tab==="map"&&<ThemeMapView episodes={episodes}/>}
      {tab==="cast"&&<CastManager cast={cast} setCast={saveCastList} hosts={hosts} setHosts={saveHostList} template={template} setTemplate={saveTpl}/>}
    </div>
    {showForm&&<EpisodeForm episode={editEp} month={month} cast={cast} hosts={hosts} template={template} onSave={handleSave} onDelete={handleDel} onCancel={function(){setShowForm(false);setEditEp(null)}}/>}
  </div>);
}
var root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
